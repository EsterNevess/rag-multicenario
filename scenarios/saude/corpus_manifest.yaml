scenario_id: saude
version: "2026-11-06"
status: em_andamento
description: "Saúde pública: protocolos clínicos do SUS (PCDT), medicamentos essenciais (RENAME) e registros de ouvidoria sintéticos"

# Endereços conferidos em 2026-11-06 (status, tipo de conteúdo e tamanho). Cada documento foi aberto e teve a portaria
# e a data lidas do próprio texto. Não há download em lote: os PDFs são coletados um a um.

bases:
  - base_id: pcdt_normativo
    natureza: normativa
    fonte: "Protocolos Clínicos e Diretrizes Terapêuticas (PCDT), Ministério da Saúde e Conitec"
    acesso:
      tipo: http_pdf
      rate_limit_seg: 2.0
      portal: "https://www.gov.br/conitec"
      urls:
        # Diabetes mellitus tipo 1: uma versão no corpus.
        - url: "https://www.gov.br/conitec/pt-br/midias/protocolos/publicacoes_ms/pcdt_diabetesmellitus_tipoi_isbn_19-08-2020.pdf/@@display-file/file"
          rotulo: "PCDT Diabete Melito Tipo 1 (Portaria Conjunta SAES/SCTIE 17/2019)"
          doc_type: pcdt
          doenca: "Diabetes mellitus tipo 1"
          versao: "Portaria Conjunta SAES/SCTIE 17/2019"
          data_publicacao: "2019-11-12"    # data da portaria; a edição do PDF é de 2020
        # Doença de Parkinson: uma versão no corpus.
        - url: "https://www.gov.br/conitec/pt-br/midias/protocolos/pcdt_doenca_de_parkinson_2017-1.pdf/@@display-file/file"
          rotulo: "PCDT Doença de Parkinson (Portaria Conjunta 10/2017)"
          doc_type: pcdt
          doenca: "Doença de Parkinson"
          versao: "Portaria Conjunta 10/2017"
          data_publicacao: "2017-11-09"    # publicação no DOU; a portaria é de 31/10/2017
        # Artrite reumatoide: quatro versões, da mais antiga à vigente. Cada uma termina na véspera da publicação da seguinte.
        - url: "https://www.gov.br/conitec/pt-br/midias/relatorios/2017/pcdt_ar_final.pdf/@@display-file/file"
          rotulo: "PCDT Artrite Reumatoide (Portaria Conjunta 15/2017; Relatório Conitec 177, dezembro de 2017)"
          doc_type: pcdt
          doenca: "Artrite reumatoide"
          versao: "Portaria Conjunta 15/2017"
          data_publicacao: "2018-01-04"    # publicação no DOU (nº 3); a portaria é de 11/12/2017
          data_vigencia_fim: "2019-11-04"
        - url: "http://antigo-conitec.saude.gov.br/images/Relatorios/2020/Relatorio_PCDT_ArtriteReumatoide_460_2020.pdf"
          rotulo: "PCDT Artrite Reumatoide (Portaria Conjunta 16/2019; Relatório Conitec 460, fevereiro de 2020)"
          doc_type: pcdt
          doenca: "Artrite reumatoide"
          versao: "Portaria Conjunta 16/2019"
          data_publicacao: "2019-11-05"    # data da portaria; a data de publicação no DOU não consta do texto lido
          # A vigência termina na véspera da publicação da Portaria Conjunta 14/2020 (DOU de 08/09/2020), a próxima do corpus.
          data_vigencia_fim: "2020-09-07"
        - url: "https://www.gov.br/conitec/pt-br/midias/consultas/relatorios/2020/20200908_relatorio_artrite_reumatoide_551.pdf/@@display-file/file"
          rotulo: "PCDT Artrite Reumatoide (Portaria Conjunta 14/2020; Relatório Conitec 551, agosto de 2020)"
          doc_type: pcdt
          doenca: "Artrite reumatoide"
          versao: "Portaria Conjunta 14/2020"
          data_publicacao: "2020-09-08"    # publicação no DOU (nº 172); a portaria é de 31/08/2020. O relatório 551 traz a decisão "Portaria Conjunta nº 14" (p. 16)
          data_vigencia_fim: "2021-09-09"
        - url: "https://www.gov.br/conitec/pt-br/midias/protocolos/20211112_portaria_conjunta_16_pcdt_ar.pdf/@@display-file/file"
          rotulo: "PCDT Artrite Reumatoide e Artrite Idiopática Juvenil (Portaria Conjunta SAES/SCTIE 16/2021)"
          doc_type: pcdt
          doenca: "Artrite reumatoide"
          versao: "Portaria Conjunta SAES/SCTIE 16/2021"
          data_publicacao: "2021-09-10"    # publicação no DOU (nº 172); a portaria é de 03/09/2021
          data_vigencia_fim: "2026-01-18"
        - url: "https://www.gov.br/saude/pt-br/assuntos/pcdt/a/artrite-reumatoide/@@download/file"
          rotulo: "PCDT Artrite Reumatoide (Portaria Conjunta SAES/SCTIE 33/2026), versão vigente"
          doc_type: pcdt
          doenca: "Artrite reumatoide"
          versao: "Portaria Conjunta SAES/SCTIE 33/2026"
          data_publicacao: "2026-01-19"    # data da portaria
        # Diabetes mellitus tipo 2: uma versão no corpus. O PDF é a Portaria SCTIE/MS 13/2026, que "torna pública a decisão de atualizar" o
        # protocolo, e traz o texto do protocolo em anexo. O texto cita as versões anteriores (Portaria SCTIE/MS 54/2020 e Portaria Conjunta
        # SAES-SECTICS/MS 7/2024, DOU de 01/03/2024), que não estão no corpus. Não foi conferido se já há portaria conjunta posterior.
        - url: "https://www.gov.br/conitec/pt-br/midias/protocolos/2026/pcdt-diabete-melito-tipo-2/@@display-file/file"
          rotulo: "PCDT Diabete Melito Tipo 2 (Portaria SCTIE/MS 13/2026, decisão de atualizar)"
          doc_type: pcdt
          doenca: "Diabetes mellitus tipo 2"
          versao: "Portaria SCTIE/MS 13/2026"
          data_publicacao: "2026-02-21"    # data da portaria; a publicação no DOU não foi conferida
      observacoes:
        - "A listagem oficial de PCDT da Conitec é um painel dinâmico e não foi lida; os documentos foram achados por busca e conferidos um a um."
        - "Diabetes mellitus tipo 2: o PDF localizado é a Portaria SCTIE/MS 13/2026 (decisão de atualizar) com o protocolo em anexo; não se confirmou se é o texto em vigor, e as versões de 2020 e 2024 ficam de fora."
        - "Um PCDT pode ter sido atualizado depois do documento coletado; o corpus é um recorte datado, não a lista oficial de vigentes."
    selecao_deterministica: true
    volume_alvo: 8
    formato: pdf
    licenca: "Documentos oficiais do Ministério da Saúde"
    sensitivity_default: publico
    campo_vigencia: data_publicacao
    chunking_sugerido: "Um chunk por seção do protocolo, guardando doença, versão (portaria), data de publicação e data de fim da vigência"
    # Seções que não respondem a "o que o protocolo estabelece" e que ocupam a maior parte do texto: bibliografia, perfis de evidência e metodologia.
    ignorar_secoes:
      - "(?i)refer[êe]ncias"
      - "(?i)perfis? de evid[êe]ncia"
      - "(?i)metodologia"
      - "(?i)declara[çc][ãa]o de conflito"
    metadados_extras: [doenca, versao, data_publicacao, data_vigencia_fim, rotulo]

  - base_id: rename_estruturado
    natureza: estruturada
    fonte: "RENAME 2024 (Relação Nacional de Medicamentos Essenciais), 2ª edição, Ministério da Saúde"
    acesso:
      tipo: http_pdf
      rate_limit_seg: 2.0
      portal: "https://www.gov.br/saude/pt-br/composicao/sectics/rename"
      urls:
        - url: "https://www.gov.br/saude/pt-br/composicao/sectics/rename/publicacoes/relacao-nacional-de-medicamentos-essenciais-2024"
          rotulo: "RENAME 2024 (Portaria GM/MS 6.324/2024), 2ª edição"
          doc_type: rename
          data_publicacao: "2024-12-26"
      observacoes:
        - "A RENAME é um PDF de tabelas (267 páginas); as linhas são extraídas das tabelas pelo normalizador, sem garantia de cobrir todas as formas de tabela do documento."
        - "A edição 2024 passou a ser atualizada em tempo real no portal do Ministério; o PDF é um retrato de uma data."
    selecao_deterministica: true
    volume_alvo: 1
    formato: pdf
    licenca: "Documentos oficiais do Ministério da Saúde"
    sensitivity_default: publico
    campo_vigencia: ano_edicao
    chunking_sugerido: "1 medicamento + apresentação = 1 linha em SQL"
    metadados_extras: [medicamento, apresentacao, componente, anexo]

  - base_id: indicadores_agregado
    natureza: agregada
    coletar: false
    motivo_nao_coletada: "decisão: os dados de internação e dispensação do SUS vêm em arquivos .dbc do FTP do DATASUS (sem CSV simples), e a agregada é calculada em SQL sobre o que já se coleta (RENAME e catálogo de PCDT)"
    fonte: "Indicadores calculados sobre a RENAME e o catálogo de PCDT coletados"
    acesso:
      tipo: rest_api
    selecao_deterministica: true
    volume_alvo: "a definir"
    formato: json
    licenca: "Derivado de documentos oficiais"
    sensitivity_default: publico
    campo_vigencia: ano
    metadados_extras: [indicador, recorte]

  - base_id: ouvidoria_conversacional
    natureza: conversacional
    coletar: false
    motivo_nao_coletada: "gerada por `python -m src.synth build` (semente fixa), fora da coleta versionada; a ingestão lê data/synthetic"
    fonte: "Registros de atendimento e ouvidoria sintéticos"
    acesso:
      tipo: sintetico
      geracao: "gerados por script com semente fixa; marcados como sintéticos em todo lugar; nenhum dado pessoal real"
      semente: 20261029
      comando: "python -m src.synth build --scenario saude"
      armadilhas: [dado_pessoal_e_clinico, pedido_de_dose_individual, pedido_de_interpretacao_de_exame]
    selecao_deterministica: true
    volume_alvo: 30
    formato: texto
    licenca: "Conteúdo sintético"
    sensitivity_default: restrito
    campo_vigencia: data
    chunking_sugerido: "1 registro = 1 chunk; mascarar telefone e e-mail antes de indexar"
    metadados_extras: [data, unidade_saude_fake, tema, sintetico]
