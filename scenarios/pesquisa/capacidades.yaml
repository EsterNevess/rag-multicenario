# Capacidades do cenário: o que o roteador aceita perguntar. Lido por src/capacidades.py.
cenario: pesquisa
descricao: pesquisa acadêmica de instituições do Rio de Janeiro (artigos, instituições, financiadores e citações, editais e normas de ética, e pareceres de revisão e correspondência editorial sintéticos)

dicas_do_analisador:
  - "Pareceres de revisão por pares e correspondência editorial (documentos sintéticos) estão disponíveis: perguntas sobre o que um parecer aponta, a recomendação de um revisor ou o que a correspondência diz usam rota documentos com naturezas [conversacional]. Os revisores são identificados só pelo código (revisor 1, revisor 2) e os manuscritos por M-0NN."
  - "A base cobre uma amostra: os 1.000 artigos mais citados de cada ano, de 2020 a 2024, de 10 instituições do RJ. Perguntas sobre outros anos ou instituições não têm dados."
  - "Para um assunto (por exemplo, aprendizado de máquina), filtre titulo__contem, palavras_chave__contem ou topico_principal__contem; os termos dos campos estão em inglês."
  - "Os financiadores aparecem com o nome oficial por extenso: FAPERJ é \"Fundação Carlos Chagas Filho de Amparo à Pesquisa do Estado do Rio de Janeiro\" (use \"Carlos Chagas Filho\"), CNPq é \"Conselho Nacional de Desenvolvimento Científico e Tecnológico\" (use \"Desenvolvimento Científico\") e CAPES é \"Coordenação de Aperfeiçoamento de Pessoal de Nível Superior\" (use \"Aperfeiçoamento de Pessoal\")."
  - "Para trabalhos de um financiador, use a entidade financiamento (financiador_nome__contem, por exemplo FAPERJ) ou trabalho com financiadores__contem. Para contar por instituição, use producao_instituicao com instituicao_alvo = 1, que seleciona as 10 instituições do RJ da amostra (sem isso entram também as coautoras de fora, como a USP)."
  - "Os mais citados: operação listar com campo_agregacao citacoes."

regras_de_resposta:
  - "Os pareceres e a correspondência editorial são documentos sintéticos (dados fictícios de demonstração): diga isso ao citá-los."
  - "Trechos marcados como [TRECHO REMOVIDO: ...] foram retirados para proteger o anonimato: não comente nem especule sobre eles, e não diga que \"não há\" algo que possa ter estado nesses trechos."
  - "Trate os revisores só pelo código (revisor 1, revisor 2). Nunca sugira quem são, onde trabalham, se conhecem os autores ou se o texto lembra algum pesquisador. Resuma apenas as críticas técnicas."
  - "A base de artigos não liga um artigo a um edital ou chamada específica: só informa os financiadores declarados em cada artigo. Nunca afirme que os projetos de um edital produziram certas publicações, nem que elas estão alinhadas ao objetivo do edital; diga que essa ligação não está nos dados."
  - "FAPERJ e a Fundação Carlos Chagas Filho de Amparo à Pesquisa do Estado do Rio de Janeiro são o mesmo financiador; CNPq é o Conselho Nacional de Desenvolvimento Científico e Tecnológico; CAPES é a Coordenação de Aperfeiçoamento de Pessoal de Nível Superior. Se a evidência traz o nome por extenso, responda com o número dela."
  - "Informe sempre que os números vêm de uma amostra dos artigos mais citados, e não de toda a produção."
  - "Não avalie a qualidade de um pesquisador. Apresente publicações, citações e financiamento como dados."

catalogo:
  cobertura: artigos publicados
  estruturada: "artigos de instituições do RJ de 2020 a 2024 (os mais citados de cada ano), com instituições, financiadores, citações e resumos"
  normativa: "editais de fomento e normas de ética em pesquisa"
  conversacional: "pareceres de revisão por pares e correspondência editorial (documentos sintéticos de demonstração)"
  aviso: "Não revelo a identidade de revisores, não avalio a qualidade de pesquisadores e não informo e-mails pessoais."

regras_de_entrada:
  - categoria: identidade_do_revisor
    mensagem: "Não revelo nem ajudo a deduzir quem foi o revisor de um manuscrito: o anonimato da revisão cega é protegido."
    padroes:
      - "\\b(quem|qual)\\s+(foi|e|era|seria|sao|foram)\\s+(o|a|os|as)?\\s*(revisor|revisora|revisores|parecerista|pareceristas|avaliador|avaliadora|referee)\\b"
      - "\\bidentific\\w+\\b.{0,25}\\b(revisor|revisora|parecerista|avaliador|avaliadora)\\b"
      - "\\b(revel\\w+|descubr\\w+|desanonimiz\\w+)\\b.{0,30}\\b(revisor|revisora|parecerista|avaliador|avaliadora)\\b"
      - "\\bquem\\s+(revisou|avaliou|aprovou|rejeitou|recusou)\\b"
  - categoria: juizo_sobre_pesquisador
    mensagem: "Não avalio a qualidade de um pesquisador. Posso mostrar publicações, citações e financiamento como dados, para você avaliar."
    padroes:
      - "\\b(e|eh|seria|sera)\\s+(um|uma)?\\s*(bom|boa|mau|ma|ruim|fraco|fraca|excelente|otimo|otima|pessimo|pessima|competente|incompetente)\\w*\\s+(pesquisador|pesquisadora|cientista|professor|professora|autor|autora)"
      - "\\b(pesquisador|pesquisadora|cientista|autor|autora)\\b.{0,40}\\b(e|eh)\\s+(bom|boa|ruim|fraco|fraca|competente|incompetente|confiavel)\\b"
      - "\\b(melhor|pior)\\s+(pesquisador|pesquisadora|cientista)\\b"
  - categoria: dado_pessoal
    mensagem: "Não informo e-mail ou outros dados pessoais de autores."
    padroes:
      - "\\be-?mail\\b.{0,20}\\b(d[eoa]s?)\\s+(autor|autora|pesquisador|pesquisadora|correspondente|revisor|revisora)"

  - categoria: inferencia_de_identidade_do_revisor
    mensagem: "Não ajudo a deduzir quem foi o revisor, de que instituição ele é ou se ele conhece os autores: o anonimato da revisão cega é protegido. Posso resumir o que o parecer aponta, tratando o revisor só pelo código."
    padroes:
      - '\b(revisor|revisora|parecerista|avaliador|avaliadora)\w*\s*\d?\b.{0,60}\b(universidade|institu\w+|departamento|laborat\w+|grupo de pesquisa|filiacao|afiliacao)\b'
      - '\b(universidade|institu\w+|departamento|laborat\w+|filiacao|afiliacao)\b.{0,40}\b(revisor|revisora|parecerista|avaliador|avaliadora)\b'
      - '\b(revisor|revisora|parecerista|avaliador|avaliadora)\w*(?:\s+\d)?(?:\s+d[oa]\s+(?:manuscrito\s+)?m-?\d+)?\s+(e|eh|seria|sera|pertence|trabalha|atua|vem)\s+(da|do|de|na|no|em)\s+(?!opiniao|ideia|mesma|parte|favor|contra|acordo|fato|certeza)\w{2,}'
      - '\b(proprio|propria)\s+(revisor|revisora|parecerista)\b|\b(revisor|revisora|parecerista|avaliador|avaliadora)\b.{0,60}\b(proprio|propria|dele|dela|seu|sua)\s+(trabalho|trabalhos|artigo|artigos|laboratorio|grupo|publicacao|publicacoes|orientandos?)\b'
      - '\b(parece|deve|seria|sera)\s+(ser\s+)?(o|a)\s+(proprio|propria)\b.{0,40}\b(autor|autora|revisor|revisora)\b'
      - '\b(conhece|conhecem)\b.{0,30}\b(autores?|autoras?)\b.{0,30}\b(revisor|revisora)|\b(revisor|revisora)\b.{0,30}\b(conhece|conhecem)\b.{0,20}\b(autores?|autoras?)\b'

niveis_consultaveis: [publico, restrito]   # no demonstrativo, o usuário é tratado como analista autorizado

regras_de_saida:
  - categoria: identidade_do_revisor_na_resposta
    mensagem: "A resposta foi bloqueada porque poderia revelar a identidade ou o vínculo de um revisor. Posso resumir o que o parecer aponta sem identificá-lo."
    padroes:
      - '(?i)\b(revisor|revisora|parecerista)\s*\d?\b.{0,80}\b(da|do|na|no|de)\s+(universidade|instituto|departamento|laborat\w+|uffv|ifpa-?x|ueep)\b'
      - '(?i)\b(uffv|ifpa-?x|ueep)\b.{0,60}\b(revisor|revisora|parecerista)\b'
      - '(?i)\b(revisor|revisora|parecerista)\s*\d?\b.{0,40}\b(e|eh|seria|e o proprio|e a propria)\b.{0,20}\b(dr|dra|prof|professor|professora)\.?\s+[A-Z]'

redacoes_na_ingestao:
  - categoria: pista_de_identidade_do_revisor
    marca: "[TRECHO REMOVIDO: pode identificar o revisor]"
    aplica_a: [parecer]
    padroes:
      - '(?i)\bonde atuo\b'
      - '(?i)\b(meu|meus|minha|minhas)\s+(grupo|laboratorio|orientandos?|orientandas?|departamento|artigo|tese|dissertacao)\b'
      - '(?i)\b(nosso|nossos|nossa)\s+(artigo|trabalho|grupo|laboratorio|universidade|instituicao|equipe)\b'
      - '\b[Nn]a nossa [A-Z]{2,}'
      - '(?i)\bfui\s+(coordenador|coordenadora|autor|autora|orientador|orientadora|membro|bolsista)\b'
      - '(?i)\bdeclaro\s+(ter|que)\b'
      - '(?i)\bcostumo dizer\b'
      - '(?i)\bcomo\s+(demonstrei|mostrei|propus|publiquei|defendi)\b'
      # Autorreferência em primeira pessoa: o revisor falando do próprio trabalho, cargo ou vínculo.
      - '(?i)\b(orientei|orientamos|participei|publiquei|publicamos|coordenei|coordenamos|lecionei|visitei|colaborei|colaboramos)\b'
      - '(?i)\b(sou|fui|era)\s+(autor|autora|professor|professora|pesquisador|pesquisadora|editor|editora|coordenador|coordenadora|membro|bolsista|ex-?aluno|ex-?aluna)\b'
      - '(?i)\b(trabalho|pesquiso|atuo|leciono|coordeno)\b.{0,50}\bha\s+(mais de\s+)?\w+\s+anos'
      - '(?i)\bha\s+(mais de\s+)?\w+\s+anos\b.{0,30}\b(pesquiso|trabalho|atuo|leciono)\b'
      - '(?i)\bem minha experiencia\b'
      - '(?i)\bpor nos\b.{0,40}\b(em|na|no)\s+(19|20)\d\d\b'
      - '(?i)\bcomo\s+(pesquisador|pesquisadora|professor|professora|editor|editora|revisor|revisora|parecerista)\w*\s+(da area|experiente|senior|ha\b)'
      - '(?i)\b(conheco|conhecemos)\s+(bem\s+)?(os autores|as autoras|o grupo|o laboratorio)\b'
entidades:
  trabalho:
    tabela: trabalho
    exibir: [id, titulo, ano, citacoes, periodico, financiadores]
    ordem_padrao: data_publicacao
    campos:
      - { nome: id, tipo: id }
      - { nome: doi, tipo: id }
      - { nome: titulo, tipo: texto }
      - { nome: ano, tipo: inteiro, agrupavel: true }
      - { nome: data_publicacao, tipo: data }
      - { nome: tipo, tipo: categoria, agrupavel: true, listar_valores: true }
      - { nome: idioma, tipo: categoria, agrupavel: true, listar_valores: true }
      - { nome: periodico, tipo: categoria, agrupavel: true }
      - { nome: acesso_aberto, tipo: inteiro, agrupavel: true }
      - { nome: status_acesso, tipo: categoria, agrupavel: true, listar_valores: true }
      - { nome: citacoes, tipo: inteiro, agregavel: true }
      - { nome: fwci, tipo: valor, agregavel: true }
      - { nome: n_autores, tipo: inteiro, agregavel: true }
      - { nome: n_instituicoes, tipo: inteiro, agregavel: true }
      - { nome: area, tipo: categoria, agrupavel: true, listar_valores: true }
      - { nome: topico_principal, tipo: categoria, agrupavel: true }
      - { nome: palavras_chave, tipo: texto }
      - { nome: financiadores, tipo: texto }
      - { nome: resumo, tipo: texto }
      - { nome: retratado, tipo: inteiro, agrupavel: true }
  producao_instituicao:
    tabela: producao_instituicao
    exibir: [trabalho_id, instituicao_nome, titulo, ano, citacoes]
    ordem_padrao: ano
    campos:
      - { nome: trabalho_id, tipo: id }
      - { nome: instituicao_id, tipo: id, agrupavel: true }
      - { nome: instituicao_nome, tipo: categoria, agrupavel: true }
      - { nome: pais, tipo: categoria, agrupavel: true }
      - { nome: instituicao_alvo, tipo: inteiro, agrupavel: true }
      - { nome: ano, tipo: inteiro, agrupavel: true }
      - { nome: titulo, tipo: texto }
      - { nome: tipo, tipo: categoria, agrupavel: true, listar_valores: true }
      - { nome: area, tipo: categoria, agrupavel: true, listar_valores: true }
      - { nome: acesso_aberto, tipo: inteiro, agrupavel: true }
      - { nome: citacoes, tipo: inteiro, agregavel: true }
  financiamento:
    tabela: financiamento
    exibir: [trabalho_id, financiador_nome, titulo, ano, citacoes]
    ordem_padrao: ano
    campos:
      - { nome: trabalho_id, tipo: id }
      - { nome: financiador_id, tipo: id, agrupavel: true }
      - { nome: financiador_nome, tipo: categoria, agrupavel: true }
      - { nome: ano, tipo: inteiro, agrupavel: true }
      - { nome: titulo, tipo: texto }
      - { nome: area, tipo: categoria, agrupavel: true, listar_valores: true }
      - { nome: citacoes, tipo: inteiro, agregavel: true }
