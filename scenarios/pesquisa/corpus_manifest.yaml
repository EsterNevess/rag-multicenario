scenario_id: pesquisa
version: "rascunho-0"
status: planejado
description: "Pesquisa acadêmica: editais de fomento, normas de ética, metadados bibliográficos e indicadores"

# Os portais abaixo são pontos de partida. Os editais e normas exatos serão escolhidos e
# conferidos na fase 2. Nada foi coletado ainda.

bases:
  - base_id: editais_normas_normativo
    natureza: normativa
    fonte: "Editais de fomento (FAPERJ, CNPq) e normas de ética em pesquisa (Conselho Nacional de Saúde)"
    acesso:
      tipo: http_pdf
      rate_limit_seg: 2.0
      # Endereços conferidos em 2026-10-28 (status, tipo e tamanho). Os endereços antigos do CNS
      # (conselho.saude.gov.br/resolucoes/...) foram desativados e redirecionam para a página inicial.
      urls:
        - url: "https://www.gov.br/conselho-nacional-de-saude/pt-br/atos-normativos/resolucoes/2012/resolucao-no-466.pdf"
          rotulo: "Resolução CNS 466/2012 (pesquisa com seres humanos)"
          doc_type: norma_etica
          data_publicacao: "2013-06-13"    # publicação no DOU; a resolução é de 12/12/2012
        - url: "https://www.gov.br/conselho-nacional-de-saude/pt-br/atos-normativos/resolucoes/2016/resolucao-no-510.pdf"
          rotulo: "Resolução CNS 510/2016 (ciências humanas e sociais)"
          doc_type: norma_etica
          data_publicacao: "2016-05-24"    # publicação no DOU; a resolução é de 07/04/2016
        - url: "https://siteantigo.faperj.br/downloads/Edital_FAPERJ_N%C2%BA_27_2021___Aux%C3%ADlio_B%C3%A1sico_%C3%A0_Pesquisa_(APQ_1)_em_ICTs_Sediadas_no_Estado_do_Rio_de_Janeiro.pdf"
          rotulo: "Edital FAPERJ 27/2021: Auxílio Básico à Pesquisa (APQ1)"
          doc_type: edital
          data_publicacao: "2021-08-19"
        - url: "https://www.faperj.br/rp/downloads/Edital_FAPERJ_N%C2%BA_13_2023___Aux%C3%ADlio_B%C3%A1sico_%C3%A0_Pesquisa_(APQ1).pdf"
          rotulo: "Edital FAPERJ 13/2023: Auxílio Básico à Pesquisa (APQ1)"
          doc_type: edital
          data_publicacao: "2023-08-03"
        - url: "https://www.faperj.br/rp/downloads/Edital_FAPERJ_N%C2%BA_20_2023___Programa_Cientista_do_Nosso_Estado.pdf"
          rotulo: "Edital FAPERJ 20/2023: Programa Cientista do Nosso Estado"
          doc_type: edital
          data_publicacao: "2023-12-14"
        - url: "https://www.faperj.br/rp/downloads/Edital_FAPERJ_N%C2%B0_38_2025_Programa_de_Apoio_a_Projetos_Cientificos_e_Tecnol%C3%B3gicos_em_Ciencias_Agrarias_no_Estado_do_RJ.pdf"
          rotulo: "Edital FAPERJ 38/2025: Projetos em Ciências Agrárias (AGRO)"
          doc_type: edital
          data_publicacao: "2025-12-04"
        - url: "https://faperj.br/rp/downloads/Instrucoes-Prestacao-Contas-2025.pdf"
          rotulo: "FAPERJ: Instruções para Prestação de Contas (2025)"
          doc_type: instrucao
          data_publicacao: null            # o documento não traz data de publicação
        - url: "http://efomento.cnpq.br/efomento/documentoPublico.do?metodo=visualizar&protocolo=7222512882593567"
          rotulo: "Chamada CNPq/MCTI 10/2023: Universal"
          doc_type: edital
          data_publicacao: "2023-06-21"
      observacoes:
        - "A chamada do CNPq vem do sistema oficial de fomento (HTTP, sem nome de arquivo); a página oficial em gov.br aponta para o mesmo PDF. O SHA-256 gravado no inventário detecta qualquer mudança."
        - "O Edital FAPERJ 05/2025, cogitado antes, retornou 404 e ficou de fora."
    dominios_institucionais: [faperj.br, cnpq.br]   # e-mails de atendimento destes órgãos são contato público
    selecao_deterministica: true     # lista fixa de URLs com SHA-256 gravado no inventário
    volume_alvo: 8
    formato: pdf
    licenca: "Documentos públicos de órgãos oficiais"
    sensitivity_default: publico
    campo_vigencia: data_publicacao
    chunking_sugerido: "Um chunk por item ou cláusula do edital, guardando número da chamada, ano e objetivo; as resoluções por artigo"
    metadados_extras: [instituicao, numero_chamada, ano, objetivo, data_publicacao]

  - base_id: openalex_estruturado
    natureza: estruturada
    fonte: "OpenAlex: trabalhos, instituições, financiadores, citações e resumos (amostra dos mais citados)"
    acesso:
      tipo: rest_api
      documentacao: "https://docs.openalex.org"
      # Instituições do RJ, fixadas pelo identificador OpenAlex (conferido em 2026-10-28):
      #   I122140584 UFRJ | I40034438 UERJ | I2699952 PUC-Rio | I161127581 UFF | I52325 Fiocruz
      #   I3130050927 UENF | I161460629 UFRRJ | I141883831 IMPA | I158509141 CEFET-RJ | I83648350 UNIRIO
      params:
        sort: "cited_by_count:desc"
        select: "id,doi,title,publication_year,publication_date,type,language,primary_location,open_access,authorships,institutions_distinct_count,cited_by_count,fwci,primary_topic,keywords,funders,awards,abstract_inverted_index,is_retracted,updated_date"
      endpoints:
        trabalhos:
          url: "https://api.openalex.org/works"
          params:
            filter: "institutions.id:I122140584|I40034438|I2699952|I161127581|I52325|I3130050927|I161460629|I141883831|I158509141|I83648350,publication_year:{ano},type:article,has_abstract:true"
          iterar:
            _ano: [2020, 2021, 2022, 2023, 2024]
      paginacao: { campo: "page", campo_tamanho: "per_page", tamanho: 200, max_paginas: 5, campo_itens: "results" }
      rate_limit_seg: 1.5
      observacoes:
        - "Sondado em 2026-10-28: 136.017 trabalhos de 2020 a 2024 nessas instituições, 91.277 artigos com resumo. Coleta-se uma amostra: os 1.000 mais citados de cada ano (5 páginas de 200), 5.000 no total."
        - "A API não aceita desempate por id na ordenação; trabalhos com a mesma contagem de citações no corte podem trocar de lugar entre coletas. O inventário guarda o SHA-256 das páginas que foram de fato coletadas."
        - "Sondado em 2026-10-28: o campo `institutions` da resposta vem sempre vazio; as instituições de cada trabalho estão em `authorships`. As páginas ficam grandes (cerca de 8 MB cada, 5.000 trabalhos no total) por causa dos artigos de colaboração gigante, que têm centenas de autores."
        - "Sem chave de API a cota é diária e compartilhada pelo IP (US$ 0,10). A coleta usa cerca de 25 requisições."
    selecao_deterministica: true
    volume_alvo: "5.000 trabalhos (1.000 por ano, 2020 a 2024)"
    formato: json
    licenca: "OpenAlex: CC0"
    sensitivity_default: publico
    campo_vigencia: ano_publicacao
    chunking_sugerido: "1 trabalho = 1 linha em SQL (trabalho, producao_instituicao, financiamento); o resumo fica como texto na tabela e pode ser indexado para a busca semântica"
    metadados_extras: [titulo, ano, instituicoes, financiadores, citacoes, topico]

  - base_id: indicadores_agregado
    natureza: agregada
    coletar: false
    motivo_nao_coletada: "fase 4: bases agregadas ainda não desenhadas em detalhe"
    fonte: "Indicadores bibliométricos derivados do OpenAlex; abstracts e textos de arXiv e SciELO"
    acesso:
      tipo: rest_api
      fontes:
        openalex: "https://api.openalex.org"
        arxiv: "http://export.arxiv.org/api/query"
        scielo: "https://www.scielo.br"
    selecao_deterministica: true
    volume_alvo: "a definir"
    formato: [json, texto]
    licenca: "Conforme a fonte; abstracts e metadados abertos"
    sensitivity_default: publico
    campo_vigencia: ano
    chunking_sugerido: "Indicadores calculados em SQL (contagens, médias, citações por ano), cada um com o recorte; abstracts em chunks de texto"
    metadados_extras: [indicador, periodo, instituicao, recorte]

  - base_id: pareceres_conversacional
    natureza: conversacional
    coletar: false
    motivo_nao_coletada: "gerada por `python -m src.synth build` (semente fixa), fora da coleta versionada; a ingestão lê data/synthetic"
    fonte: "Pareceres de revisão por pares e correspondência editorial sintéticos"
    acesso:
      tipo: sintetico
      geracao: "gerados por script com semente fixa; marcados como sintéticos em todo lugar"
      semente: 20261029
      comando: "python -m src.synth build --scenario pesquisa"
      armadilhas: [pista_de_identidade, pedido_de_identidade, dado_pessoal]
    selecao_deterministica: true
    volume_alvo: 21
    formato: texto
    licenca: "Conteúdo sintético"
    sensitivity_default: restrito
    campo_vigencia: data
    chunking_sugerido: "1 parecer = 1 chunk; pistas de identidade do revisor plantadas de propósito para testar a recusa"
    metadados_extras: [manuscrito_id, revisor_codigo, data, sintetico]
