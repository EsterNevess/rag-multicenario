      tipo: categoria
      agrupavel: true
    - nome: municipio_nome
      tipo: categoria
      agrupavel: true
    - nome: ano_compra
      tipo: inteiro
      agrupavel: true
    - nome: modalidade_nome
      tipo: categoria
      listar_valores: true
      agrupavel: true
    - nome: situacao_nome
      tipo: categoria
      listar_valores: true
      agrupavel: true
    - nome: srp
      tipo: inteiro
      agrupavel: true
    - nome: objeto_compra
      tipo: texto
    - nome: amparo_legal_nome
      tipo: categoria
      agrupavel: true
    - nome: valor_total_estimado
      tipo: valor
      agregavel: true
    - nome: valor_total_homologado
