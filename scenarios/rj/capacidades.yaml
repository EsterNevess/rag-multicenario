    - valor_total_homologado
    - data_publicacao
    ordem_padrao: data_publicacao
    campos:
    - nome: numero_controle_pncp
      tipo: id
    - nome: orgao_cnpj
      tipo: id
      agrupavel: true
    - nome: orgao_razao_social
      tipo: categoria
      agrupavel: true
    - nome: esfera_id
      tipo: categoria
      agrupavel: true
      valores: {F: Federal, E: Estadual, M: Municipal}
